[project]
name = "ksqldb-ui"
version = "0.0.0"
requires-python = "==3.14.6"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
    "jinja2",
    "httpx",
    "dynaconf",
    "python-multipart",
    "babel",
]

[dependency-groups]
dev = [
    "ipdb",
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-mock",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".git", ".idea", "__pycache__", "venv", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "T10", "T20"]
ignore = ["B904", "B905", "SIM102", "SIM108", "SIM110", "SIM113", "SIM114", "SIM116"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = false
known-first-party = ["app"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.14"
root = ["src"]

[tool.ty.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"
